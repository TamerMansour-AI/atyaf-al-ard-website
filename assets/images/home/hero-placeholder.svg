  <desc id="desc">Soft gradient rectangle with centered placeholder text</desc>
  <defs>
    <linearGradient id="heroGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f4ff" />
      <stop offset="100%" stop-color="#d9e4ff" />
