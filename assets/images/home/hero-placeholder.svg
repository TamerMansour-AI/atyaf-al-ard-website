  <rect x="0" y="0" width="800" height="400" fill="url(#heroGradient)" rx="12" ry="12" />
  <text x="50%" y="50%" dominant-baseline="middle" text-anchor="middle" fill="#2c3e50" font-family="Arial, sans-serif" font-size="24" font-weight="600">
